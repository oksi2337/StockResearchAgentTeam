services:
  stock-bot:
    image: stock-bot
    container_name: stock-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Seoul
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./research:/app/research
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
